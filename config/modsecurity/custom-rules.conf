# Local custom rules for waf-lab.
# Start in DetectionOnly while tuning and then switch to On.

# Example: Allow a known health check path with low false positive risk.
SecRule REQUEST_URI "@streq /healthz" \
  "id:1000001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

# Example: Block suspicious scanner user-agent strings.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|acunetix)" \
  "id:1000002,phase:1,deny,status:403,log,msg:'Blocked known scanner user-agent'"
