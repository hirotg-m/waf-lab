version: "3.9"

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf-lab
    restart: unless-stopped
    ports:
      - "${WAF_HTTP_PORT:-80}:80"
      - "${WAF_HTTPS_PORT:-443}:443"
    environment:
      # Block suspicious traffic by default. Set to DetectionOnly during tuning.
      - PARANOIA=${PARANOIA:-1}
      - ANOMALY_INBOUND=${ANOMALY_INBOUND:-5}
      - ANOMALY_OUTBOUND=${ANOMALY_OUTBOUND:-4}
      - PROXY=${PROXY:-1}
      - BACKEND=${BACKEND:-http://host.docker.internal:8080}
      - REPORTING_LEVEL=${REPORTING_LEVEL:-2}
      - ERRORLOG=${ERRORLOG:-/dev/stdout}
      - ACCESSLOG=${ACCESSLOG:-/dev/stdout}
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      - BLOCKING_PARANOIA=${BLOCKING_PARANOIA:-1}
      - TZ=${TZ:-UTC}
    volumes:
      - ../../config/modsecurity/custom-rules.conf:/etc/modsecurity.d/owasp-crs/custom-rules.conf:ro
      - waf_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  waf_logs:
